<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#164A9B">
    {% seo %}
    {% feed_meta %}

    <link rel="icon" type="image/png" href="{{ '/assets/images/bjola_logo.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&amp;family=Azeret+Mono:wght@400;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class | default: 'page' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/bjola_logo.png' | relative_url }}" width="75" height="71" alt="">
          <span class="brand__type">
            <strong>Bjola</strong>
            <small>Open source workshop</small>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/#projects' | relative_url }}">Projects</a>
          <a href="{{ '/notes/' | relative_url }}">Notes</a>
          <a href="https://github.com/orlenko" rel="me">GitHub ↗</a>
        </nav>
      </div>
    </header>

    {{ content }}

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div>
          <p class="site-footer__name">Bjola Software Inc.</p>
          <p>Useful tools, unfinished questions, and notes from the workbench.</p>
        </div>
        <nav aria-label="Footer navigation">
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a>
          <a href="https://bjola.ca">Company</a>
        </nav>
      </div>
    </footer>
  </body>
</html>

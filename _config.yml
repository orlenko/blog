title: Brain Dump Blog
description: An experimental Claude-powered, zero-friction blog. Straight from dictation to the web.
url: "https://orlenko.github.io"
baseurl: "/blog"
lang: en

# Author + social — consumed by jekyll-seo-tag for OG/Twitter cards and JSON-LD.
author:
  name: Vlad Orlenko
twitter:
  # username: yourhandle   # uncomment to add twitter:creator / twitter:site
  # (the summary_large_image card itself is emitted directly in _layouts/default.html)

# Build settings
future: true
markdown: kramdown
highlighter: rouge

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor
  - node_modules
  - scripts

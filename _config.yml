title: Bjola Open Source
description: Small, inspectable software from Bjola, with notes from building and using it.
url: "https://bjola.org"
baseurl: ""
lang: en

# Author + social — consumed by jekyll-seo-tag for OG/Twitter cards and JSON-LD.
author:
  name: Vlad Orlenko

# Build settings
future: true
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

permalink: /:year/:month/:day/:title.html

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor
  - node_modules
  - scripts
  - PRODUCT.md
  - DESIGN.md
  - docs
  - .impeccable

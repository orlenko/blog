    description: "Find and compare overused metaphorical language in AI conversation logs."
    repository: "https://github.com/orlenko/load-bearing"
  - name: Sound Visualizer
    status_label: Source experiment
    language: TypeScript
    description: "A browser-built fireplace for music, inspired by the Winamp years."
    repository: "https://github.com/orlenko/sound-visualizer"

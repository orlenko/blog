    language: Swift + Kotlin
    description: "A native rhythm machine and its Android running companion."
    repository: "https://github.com/orlenko/takt"
  - name: Agentpool
    status_label: Installable
    language: Go
    description: "Select an available account across multiple paid coding-agent subscriptions."
    repository: "https://github.com/orlenko/agentpool"
  - name: Load Bearing
    status_label: Source experiment
